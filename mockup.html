<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone mock-up</title>
  <style>
    body { margin: 0; padding: 28px 16px 48px; background: #e9edf5; font-family: system-ui, "Segoe UI", sans-serif; color: #1c2333; }
    h1 { text-align: center; font-size: 1.2rem; margin: 0 0 4px; }
    p.sub { text-align: center; color: #667; margin: 0 0 24px; font-size: .9rem; }
    .stage { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: flex-start; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 12px; font-weight: 600; }
    figcaption small { display: block; font-weight: 400; color: #667; }

    /* Each phone is drawn at real size, then scaled down to fit a laptop screen. */
    .iphone-wrap  { width: 272px; height: 576px; }
    .android-wrap { width: 278px; height: 616px; }
    .scale { transform-origin: top left; transform: scale(.65); }

    .phone { position: relative; background: #111; box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 0 0 2px #3a3a3a; }
    .screen { background: #fff; overflow: hidden; display: flex; flex-direction: column; }
    .screen iframe { display: block; border: 0; flex: 1; width: 100%; }
    .status { display: flex; justify-content: space-between; align-items: center; background: #fff; color: #111; font-size: 15px; font-weight: 600; flex: none; }
    .status .icons { letter-spacing: 2px; font-size: 12px; }

    /* iPhone: 390 x 844 screen */
    .iphone { width: 390px; padding: 14px; border-radius: 62px; box-sizing: content-box; }
    .iphone .screen { width: 390px; height: 844px; border-radius: 48px; }
    .iphone .status { height: 50px; padding: 6px 34px 0 36px; }
    .iphone .island { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 2; }
    .iphone .home { height: 22px; background: #fff; flex: none; position: relative; }
    .iphone .home::after { content: ""; position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: #111; }

    /* Android: 412 x 915 screen */
    .android { width: 412px; padding: 12px; border-radius: 44px; box-sizing: content-box; }
    .android .screen { width: 412px; height: 915px; border-radius: 30px; }
    .android .status { height: 34px; padding: 0 22px; font-size: 14px; }
    .android .punch { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; background: #000; border-radius: 50%; z-index: 2; box-shadow: 0 0 0 2px #222; }
    .android .nav { height: 40px; background: #fff; flex: none; display: flex; justify-content: center; align-items: center; gap: 70px; color: #444; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Expense Tracker — phone mock-up</h1>
  <p class="sub">The live app runs inside each frame — you can click and scroll it.</p>
  <div class="stage">
    <figure>
      <div class="iphone-wrap"><div class="scale">
        <div class="phone iphone">
          <div class="island"></div>
          <div class="screen">
            <div class="status"><span>9:41</span><span class="icons">▂▄▆ ᯤ ▮</span></div>
            <iframe src="index.html" title="iPhone preview"></iframe>
            <div class="home"></div>
          </div>
        </div>
      </div></div>
      <figcaption>iPhone <small>390 × 844</small></figcaption>
    </figure>

    <figure>
      <div class="android-wrap"><div class="scale">
        <div class="phone android">
          <div class="punch"></div>
          <div class="screen">
            <div class="status"><span>9:41</span><span class="icons">▂▄▆ ᯤ ▮</span></div>
            <iframe src="index.html" title="Android preview"></iframe>
            <div class="nav"><span>◁</span><span>○</span><span>□</span></div>
          </div>
        </div>
      </div></div>
      <figcaption>Android <small>412 × 915</small></figcaption>
    </figure>
  </div>
</body>
</html>
